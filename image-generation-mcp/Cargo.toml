[package]
name = "image-generation-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
base64 = "0.22"
clap = { version = "4", features = ["derive"] }
image = { version = "0.25", default-features = false, features = [
  "png",
  "jpeg",
  "webp",
] }
reqwest = { version = "0.12", default-features = false, features = [
  "json",
  "rustls-tls",
] }
rmcp = { version = "3.4", features = ["transport-io"] }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "sync",
  "time",
] }

[dev-dependencies]
tokio = { version = "1", features = ["io-util"] }
wiremock = "0.6"

[profile.release]
strip = true
lto = "thin"
