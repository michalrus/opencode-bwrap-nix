[package]
name = "mcp-session-mux"
version = "0.1.0"
edition = "2024"
rust-version = "1.91"
license = "Apache-2.0"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
libc = "0.2"
rmcp = { version = "3.4", features = ["client", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = [
  "macros",
  "process",
  "rt-multi-thread",
  "signal",
  "sync",
  "time",
] }
tokio-util = "0.7"

[[test]]
name = "mux"
harness = false

[profile.release]
strip = true
lto = "thin"
